<svg xmlns="http://www.w3.org/2000/svg"
     width="1254"
     height="1254"
     viewBox="0 0 1254 1254"
     fill="none">
  <title>DataTool Erkennungsrahmen für den ausgefüllten PDF-Stapel</title>
  <desc>
    Transparente, getrennt animierbare Rahmenebene. Dunkelrot kennzeichnet
    automatisch erkannte Antworten, Grün eine manuelle Korrektur und Violett
    vollständige Rasterzeilen beziehungsweise einen Konflikt.
  </desc>

  <defs>
    <style>
      .overlay-item {
        transform-box: fill-box;
        transform-origin: center;
      }

      .detected {
        fill: #fbbf24;
        fill-opacity: .18;
        stroke: #b91c1c;
        stroke-width: 2.5;
      }

      .corrected {
        fill: #22c55e;
        fill-opacity: .12;
        stroke: #22c55e;
        stroke-width: 2.5;
      }

      .raster {
        fill: #fbbf24;
        fill-opacity: .08;
        stroke: #7c3aed;
        stroke-width: 2.5;
      }

      .conflict-cell {
        fill: #fbbf24;
        fill-opacity: .16;
        stroke: #7c3aed;
        stroke-width: 2.25;
      }

      rect {
        vector-effect: non-scaling-stroke;
        shape-rendering: geometricPrecision;
      }
    </style>
  </defs>

  <!-- Abschnitt 1: Aussagen zum Arbeitsalltag -->
  <g id="section-1">
    <rect id="detected-s1-r1"
          class="overlay-item detected"
          data-enter="left"
          x="482" y="209" width="103" height="51"/>
    <rect id="detected-s1-r2"
          class="overlay-item detected"
          data-enter="right"
          x="585" y="260" width="107" height="52"/>
    <rect id="corrected-s1-r3"
          class="overlay-item corrected"
          data-enter="top"
          x="692" y="312" width="104" height="53"/>
    <rect id="detected-s1-r4"
          class="overlay-item detected"
          data-enter="right"
          x="796" y="365" width="106" height="52"/>
  </g>

  <!-- Abschnitt 2: Skala 0 bis 10 -->
  <g id="section-2">
    <rect id="detected-s2-value-7"
          class="overlay-item detected"
          data-enter="bottom"
          x="703" y="543" width="76" height="51"/>
  </g>

  <!-- Abschnitt 3: Häufigkeitsraster -->
  <g id="section-3">
    <rect id="detected-s3-r1"
          class="overlay-item detected"
          data-enter="left"
          x="580" y="686" width="85" height="52"/>

    <rect id="raster-s3-r2"
          class="overlay-item raster"
          data-enter="left"
          x="424" y="738" width="573" height="50"/>
    <rect id="detected-s3-r2"
          class="overlay-item detected"
          data-enter="right"
          x="751" y="738" width="88" height="50"/>

    <rect id="detected-s3-r3"
          class="overlay-item detected"
          data-enter="right"
          x="839" y="788" width="83" height="50"/>

    <rect id="raster-s3-r4-conflict"
          class="overlay-item raster"
          data-enter="left"
          x="424" y="838" width="573" height="52"/>
    <rect id="conflict-s3-r4-a"
          class="overlay-item conflict-cell"
          data-enter="bottom"
          x="665" y="838" width="86" height="52"/>
    <rect id="conflict-s3-r4-b"
          class="overlay-item conflict-cell"
          data-enter="bottom"
          x="751" y="838" width="88" height="52"/>

    <rect id="detected-s3-r5"
          class="overlay-item detected"
          data-enter="right"
          x="839" y="890" width="83" height="50"/>
  </g>

  <!-- Abschnitt 4: Mehrfachauswahl -->
  <g id="section-4">
    <rect id="detected-s4-clear-goals"
          class="overlay-item detected"
          data-enter="left"
          x="190" y="1002" width="24" height="24"/>
    <rect id="corrected-s4-work-equipment"
          class="overlay-item corrected"
          data-enter="right"
          x="606" y="1039" width="24" height="24"/>
    <rect id="conflict-s4-flex-time"
          class="overlay-item conflict-cell"
          data-enter="left"
          x="190" y="1076" width="24" height="24"/>
  </g>
</svg>
